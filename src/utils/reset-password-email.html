<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Request</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 20px;
        color: #333;
      }
      .email-container {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 0 auto;
        padding: 30px;
        text-align: center;
      }
      .email-header {
        font-size: 24px;
        font-weight: bold;
        color: #333;
      }
      .email-content {
        font-size: 16px;
        color: #555;
        margin: 20px 0;
      }
      .reset-link {
        display: inline-block;
        background-color: #4caf50;
        color: white;
        padding: 12px 24px;
        font-size: 18px;
        text-decoration: none;
        border-radius: 5px;
        margin-top: 20px;
      }
      .reset-link:hover {
        background-color: #45a049;
      }
      .footer {
        font-size: 14px;
        color: #777;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="email-header">Password Reset Request</div>
      <div class="email-content">
        <p>Hello, {{name}}!</p>
        <p>
          We received a request to reset your password. Click the link below to
          create a new password for your account:
        </p>
        <a href="{{link}}" class="reset-link">Reset Password</a>
        <p>If you didn't request a password reset, please ignore this email.</p>
      </div>
      <div class="footer">
        <p>Best regards,</p>
        <p>The Team</p>
      </div>
    </div>
  </body>
</html>
